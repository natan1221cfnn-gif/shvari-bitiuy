      /* מחיקה מוחלטת של תגית Powered by Netlify */
      a[href*="netlify"],
      div[class*="netlify"],
      div[id*="netlify"],
      [data-netlify-badge],
      .netlify-badge,
      #netlify-badge,
      iframe[src*="netlify"],
      [class*="feedback"],
      [id*="feedback"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;

        top: -9999px !important;
        left: -9999px !important;

    <script>
      // צייד אלמנטים של Netlify בזמן אמת
      function killNetlifyBadge() {
        const badges = document.querySelectorAll(
          'a[href*="netlify"], [class*="netlify"], [id*="netlify"], iframe[src*="netlify"], [data-netlify]'
        );
        badges.forEach(b => {
          if (b.id !== 'root') b.remove();
        });
      }
      document.addEventListener('DOMContentLoaded', killNetlifyBadge);
      window.addEventListener('load', killNetlifyBadge);
      setInterval(killNetlifyBadge, 150);
      const observer = new MutationObserver(() => killNetlifyBadge());
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>
